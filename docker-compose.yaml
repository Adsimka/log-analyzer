services:
  postgres:
    image: postgres:16-alpine
    container_name: log-clustering-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-log_clustering}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-log_clustering}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: log-clustering-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: log-clustering-app
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - model_cache:/root/.cache
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: log-clustering-worker
    command: arq src.workers.clustering_worker.WorkerSettings
    volumes:
      - .:/app
      - model_cache:/root/.cache
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  model_cache: